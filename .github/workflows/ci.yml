name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Public website (Next.js) in ./website
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/sunflower_db"

      - name: Run ESLint
        run: npm run lint

      - name: Verify Next.js build
        run: npm run build
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/sunflower_db"
          NEXT_PUBLIC_SITE_URL: "https://gulfmarketwire.com"

  # News CMS ("Ammlan Writes", Express) in ./cms
  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/cms"

      - name: Type-check and build
        run: npm run build
